name: PolySharp top 10
# Started by the polysharp Cloudflare Worker:
#   - /polysharp in Discord      -> source=command, relay=<encrypted interaction>  (replies to the command)
#   - SCAN button on the site    -> source=dashboard, relay=''                     (posts to DISCORD_WEBHOOK_URL)
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'command or dashboard'
        required: true
        default: command
      relay:
        description: 'AES-GCM encrypted interaction credentials (command only)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: polysharp-${{ inputs.source }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decrypt interaction
        if: inputs.source == 'command'
        env:
          RELAY_PAYLOAD: ${{ inputs.relay }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: node scripts/polysharp.mjs decrypt
      - name: Scan roster and rank conviction
        run: node scripts/polysharp.mjs scan
      - name: Deliver to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ inputs.source == 'dashboard' && secrets.DISCORD_WEBHOOK_URL || '' }}
        run: node scripts/polysharp.mjs post
      - name: Report failure
        if: failure() && env.INTERACTION_TOKEN != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/polysharp.mjs fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polysharp-${{ github.run_id }}
          path: out/
          retention-days: 14
