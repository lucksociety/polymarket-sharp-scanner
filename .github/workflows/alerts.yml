name: Big-bet alerts
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alerts
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: .alert-state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - run: node scripts/watch.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .alert-state.json
          key: alert-state-${{ github.run_id }}
