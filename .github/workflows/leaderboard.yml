name: Bettor leaderboard
on:
  schedule:
    - cron: '17 9 * * *'   # daily, 4:17am Eastern
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/leaderboard*.mjs', '.github/workflows/leaderboard.yml']
permissions:
  contents: write
concurrency:
  group: leaderboard
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/leaderboard-stats.test.mjs
      - name: Score wallets on their last 180 days of pre-game sports bets
        env:
          PROBE: '1'
          DISCOVER_WIDE: '1'
          DISCOVER_DEPTH: '1000'
          MAX_WALLETS: '7500'
        run: node scripts/leaderboard.mjs
      - name: Save probe result on this branch
        if: startsWith(github.ref_name, 'probe/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe.json
          git diff --cached --quiet || git commit -m "probe: wide discovery $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
