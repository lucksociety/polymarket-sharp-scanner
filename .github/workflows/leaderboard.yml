name: Bettor leaderboard
on:
  schedule:
    - cron: '17 9 * * *'   # daily, 4:17am Eastern
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/leaderboard*.mjs', '.github/workflows/leaderboard.yml']
permissions:
  contents: write
concurrency:
  group: leaderboard-probe
  cancel-in-progress: false
jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-price chosen bettors' early bets at later market prices
        env:
          NODE_OPTIONS: --max-old-space-size=10000
        run: node scripts/probe-tail.mjs
      - name: Save probe result on this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe-tail.json
          git diff --cached --quiet || git commit -m "probe: tail re-pricing $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${{ github.ref_name }}" && git push
