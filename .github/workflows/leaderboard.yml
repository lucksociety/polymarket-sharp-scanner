name: Bettor leaderboard
on:
  schedule:
    - cron: '17 9 * * *'   # daily, 4:17am Eastern
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/leaderboard*.mjs', '.github/workflows/leaderboard.yml']
permissions:
  contents: write
concurrency:
  group: leaderboard
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/leaderboard-stats.test.mjs
      - name: Score wallets on their last 180 days of pre-game sports bets
        run: node scripts/leaderboard.mjs
      - name: Publish leaderboard
        if: github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json data/listed.json
          git diff --cached --quiet || git commit -m "leaderboard: daily refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push
